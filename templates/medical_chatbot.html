<!DOCTYPE html>
<html>
<head>
  <title>Chatbot</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    /* Add your custom CSS styling here */
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chat-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #chat-header {
      background: #007BFF;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    #chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .user-message, .bot-message {
      padding: 10px 20px;
      border-radius: 20px;
      margin-bottom: 10px;
      max-width: 70%;
    }
    .user-message {
      background: #007BFF;
      color: white;
      align-self: flex-end;
    }
    .bot-message {
      background: #f0f0f0;
      color: #333;
      align-self: flex-start;
    }
    #input-container {
      display: flex;
      padding: 20px;
      border-top: 1px solid #ddd;
    }
    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
      margin-right: 10px;
    }
    #send-button {
      padding: 10px 20px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="chat-header">Medi Chatbot</div>
    <ul id="chat-messages"></ul>
    <div id="input-container">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button id="send-button">Send</button>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const chatMessages = document.getElementById("chat-messages");
      const userInput = document.getElementById("user-input");
      const sendButton = document.getElementById("send-button");

      sendButton.addEventListener("click", function () {
        const userMessage = userInput.value;
        if (userMessage.trim() !== "") {
          displayUserMessage(userMessage);
          sendUserInputToBackend(userMessage);
          userInput.value = "";
        }
      });

      userInput.addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          const userMessage = userInput.value;
          if (userMessage.trim() !== "") {
            displayUserMessage(userMessage);
            sendUserInputToBackend(userMessage);
            userInput.value = "";
          }
        }
      });

      function displayUserMessage(message) {
        const listItem = document.createElement("li");
        listItem.className = "user-message";
        listItem.innerText = message;
        chatMessages.appendChild(listItem);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function displayBotMessage(message) {
        const listItem = document.createElement("li");
        listItem.className = "bot-message";
        listItem.innerText = message;
        chatMessages.appendChild(listItem);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function sendUserInputToBackend(userMessage) {
        // Send the user's message to the Flask backend using a fetch request
        fetch("/get_response", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message: userMessage }),
        })
          .then((response) => response.json())
          .then((data) => {
            // Display the response from the backend
            const botResponse = data.response || "I'm not sure how to respond to that. Please ask another question.";
            displayBotMessage(botResponse);
          })
          .catch((error) => {
            console.error("Error sending message to the backend:", error);
          });
      }
    });
  </script>
</body>
</html>
