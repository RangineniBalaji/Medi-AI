<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .container-p {
            display: flex;
            align-items: left;
            height: 61vh;
            border: 1px solid #ccc;
            padding: 30px;
            position: absolute;
            left: 0;
            margin-left: 10px;
            width: 125vh;
        }

        .image-p {
            position: absolute;
            right: 0;
            width: 68vh;
            height: 69vh;
            margin-right: 10px;
        }

        input{
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button{
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        h2{
            font-size: 30px;
            color: #333;
        }

        button:hover {
            opacity: 0.8;
        }

        #prediction{
            margin-top: 20px;
            
        }

    </style>
</head>
<body>
    <header>
        <h1>Medi AI - Your Medical AI Assistant</h1>
    </header>
    <main>
        <section class="container-p">
            <div class="input-section">
                <h2>Pneumonia Detection</h2>
                <p>Upload your chest X-ray image to detect pneumonia using our AI-powered image analysis tool.</p>

                <form action="{{url_for('pneumoniaDetection')}}" method="post" enctype="multipart/form-data">
                    <input type="file" name="image" accept=".jpg, .jpeg, .png" required>

                    <button type="submit">Detect Pneumonia</button>
                </form>
                
                <div id="prediction">
                    <h3>Prediction</h3>
                    <p id="prediction-result">{{ data | safe }}</p>
                    <div id="image-p"></div>
                </div>
            </div>

            <!-- div class="info-section">
                <h3>How It Works</h3>
                <p>Our system processes chest X-ray images and uses advanced machine learning techniques to identify signs of pneumonia.</p>
            </div -->
        </section>
        
        <section class="image-p">
            <image src="{{url_for('static', filename='images/image.png')}}" alt="Pneumonia Detection", width="100%", height="100%">
        </section>
    </main>

    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            const uploadedImage = document.querySelector('input[type="file"]');
            const file = uploadedImage.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function() {
                    const image = new Image();
                    image.src = reader.result;
                    image.width = 200; 
                    image.height = 200;
                    const predictionContainer = document.getElementById('image-p');
                    predictionContainer.appendChild(image);
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
    
        
</body>
</html>
